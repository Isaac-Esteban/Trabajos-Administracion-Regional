<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de trabajos · Administración regional</title>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1d2a2a; --muted: #5d6b6b;
    --line: #dde2df; --brand: #1f5c57; --ok: #2f7d4f; --warn: #b9770e; --idea: #4a5d8f;
    --ok-bg: #e4f2e9; --warn-bg: #fbeed6; --idea-bg: #e6eaf5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a1a; --panel: #1b2424; --ink: #e6ecea; --muted: #9aa9a6; --line: #2c3838;
      --brand: #62b5ac; --ok: #6cc28c; --warn: #e2a84a; --idea: #93a6de;
      --ok-bg: #1d3327; --warn-bg: #3a2d14; --idea-bg: #222b45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  header { padding: 28px 20px 8px; max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 20px 60px; }
  .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 16px 0 24px; }
  .dato { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .dato b { display: block; font-size: 1.5rem; }
  .dato span { color: var(--muted); font-size: .9rem; }
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  select, input[type=search] { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--ink); }
  input[type=search] { flex: 1; min-width: 180px; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tabs button { font: inherit; background: none; border: 0; padding: 10px 14px; cursor: pointer;
    color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }
  .lista { display: grid; gap: 10px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .item.ok { border-left-color: var(--ok); } .item.warn { border-left-color: var(--warn); } .item.idea { border-left-color: var(--idea); }
  .item h3 { margin: 0; font-size: 1.05rem; }
  .casa { color: var(--muted); font-size: .9rem; }
  .monto { font-weight: 700; font-size: 1.1rem; text-align: right; }
  .meta { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .8rem; font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.idea { background: var(--idea-bg); color: var(--idea); }
  .vacio { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; }
  footer { color: var(--muted); font-size: .85rem; padding-top: 24px; }
  @media (max-width: 520px) { .item { grid-template-columns: 1fr; } .monto { text-align: left; } }
</style>
</head>
<body>
<header>
  <h1>Panel de trabajos</h1>
  <p class="sub">Administración regional · <span id="fecha"></span></p>
</header>
<main>
  <section class="resumen" id="resumen" aria-label="Resumen"></section>

  <div class="barra">
    <label>Casa de oración
      <select id="filtroCasa"><option value="">Todas</option></select>
    </label>
    <input type="search" id="buscar" placeholder="Buscar por título o nota" aria-label="Buscar">
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="aprobados" aria-selected="true">Trabajos aprobados</button>
    <button role="tab" data-tab="pendientes" aria-selected="false">Trabajos pendientes</button>
    <button role="tab" data-tab="porAnalizar" aria-selected="false">Proyectos por analizar</button>
  </div>

  <div class="lista" id="lista"></div>
  <footer>Los trabajos aprobados son los autorizados en reunión de ministerio. Lo que viene de reunión de administración queda en "por analizar" hasta pasar por ministerio.</footer>
</main>

<script>
const clp = n => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fechaCorta = f => f ? new Date(f + 'T00:00:00').toLocaleDateString('es-CL') : '';

let DATA = null, tab = 'aprobados';

async function cargar() {
  try {
    const r = await fetch('data.json', { cache: 'no-store' });
    DATA = await r.json();
  } catch (e) {
    document.getElementById('lista').innerHTML = '<div class="vacio">No se pudo cargar data.json. Si abriste el archivo con doble clic, prueba desde GitHub Pages o con un servidor local.</div>';
    return;
  }
  document.getElementById('fecha').textContent = 'actualizado el ' + fechaCorta(DATA.actualizado);
  const sel = document.getElementById('filtroCasa');
  DATA.casas.forEach(c => sel.insertAdjacentHTML('beforeend', `<option>${esc(c)}</option>`));
  sel.onchange = pintar;
  document.getElementById('buscar').oninput = pintar;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    pintar();
  });
  pintar();
}

function filtrar(lista) {
  const casa = document.getElementById('filtroCasa').value;
  const q = document.getElementById('buscar').value.toLowerCase();
  return lista.filter(i => (!casa || i.casa === casa) &&
    (!q || (i.titulo + ' ' + (i.nota || i.detalle || '')).toLowerCase().includes(q)));
}

function pintarResumen() {
  const ap = filtrar(DATA.aprobados), pe = filtrar(DATA.pendientes), an = filtrar(DATA.porAnalizar);
  const total = ap.reduce((s, i) => s + i.presupuesto, 0);
  const porEjec = ap.filter(i => i.avance !== 'Terminado').reduce((s, i) => s + i.presupuesto, 0);
  const estim = pe.reduce((s, i) => s + i.estimado, 0);
  document.getElementById('resumen').innerHTML = [
    [clp(total), `Presupuesto aprobado (${ap.length} trabajos)`],
    [clp(porEjec), 'Aprobado aún sin terminar'],
    [clp(estim), `Estimado pendiente (${pe.length} trabajos)`],
    [an.length, 'Proyectos por analizar']
  ].map(([v, l]) => `<div class="dato"><b>${v}</b><span>${l}</span></div>`).join('');
}

function tarjeta(i, tipo) {
  if (tipo === 'aprobados') {
    const cls = i.avance === 'Terminado' ? 'ok' : 'ok';
    return `<article class="item ok"><div><h3>${esc(i.titulo)}</h3><div class="casa">${esc(i.casa)}</div></div>
      <div class="monto">${clp(i.presupuesto)}</div>
      <div class="meta"><span class="tag ${cls}">${esc(i.avance)}</span><span>Aprobado en reunión de ministerio: ${fechaCorta(i.reunion)}</span>${i.nota ? `<span>${esc(i.nota)}</span>` : ''}</div></article>`;
  }
  if (tipo === 'pendientes') {
    return `<article class="item warn"><div><h3>${esc(i.titulo)}</h3><div class="casa">${esc(i.casa)}</div></div>
      <div class="monto">${clp(i.estimado)} <span class="casa">est.</span></div>
      <div class="meta"><span class="tag warn">Prioridad ${esc(i.prioridad)}</span><span>Espera: ${esc(i.espera)}</span><span>${esc(i.origen)}</span></div></article>`;
  }
  return `<article class="item idea"><div><h3>${esc(i.titulo)}</h3><div class="casa">${esc(i.casa)}</div></div><div></div>
    <div class="meta"><span class="tag idea">${esc(i.origen)}</span><span>${esc(i.detalle)}</span></div></article>`;
}

function pintar() {
  pintarResumen();
  const datos = filtrar(DATA[tab]);
  document.getElementById('lista').innerHTML = datos.length
    ? datos.map(i => tarjeta(i, tab)).join('')
    : '<div class="vacio">No hay elementos con este filtro.</div>';
}
cargar();
</script>
</body>
</html>
